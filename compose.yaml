name: smartis-lms
services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      APP_SITE_ADDRESS: "${APP_SITE_ADDRESS:-http://localhost}"
      SCORM_SITE_ADDRESS: "${SCORM_SITE_ADDRESS:-http://scorm.localhost}"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - media_data:/srv/media:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
  web:
    build: ./frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-unsafe-development-key}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-true}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,scorm.localhost,127.0.0.1,api}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}"
      DJANGO_SECURE_COOKIES: "${DJANGO_SECURE_COOKIES:-false}"
      DJANGO_SECURE_SSL_REDIRECT: "${DJANGO_SECURE_SSL_REDIRECT:-false}"
      DJANGO_SECURE_HSTS_SECONDS: "${DJANGO_SECURE_HSTS_SECONDS:-0}"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}"
      DJANGO_SECURE_HSTS_PRELOAD: "${DJANGO_SECURE_HSTS_PRELOAD:-false}"
      API_TOKEN_TTL_SECONDS: "${API_TOKEN_TTL_SECONDS:-43200}"
      SCORM_CONTENT_ORIGIN: "${SCORM_CONTENT_ORIGIN:-http://scorm.localhost}"
      POSTGRES_DB: "${POSTGRES_DB:-smartis_lms}"
      POSTGRES_USER: "${POSTGRES_USER:-smartis}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-smartis_local_password}"
      POSTGRES_HOST: db
      BOOTSTRAP_DEMO: "${BOOTSTRAP_DEMO:-false}"
      DEMO_ADMIN_EMAIL: "${DEMO_ADMIN_EMAIL:-admin@smartis.local}"
      DEMO_ADMIN_PASSWORD: "${DEMO_ADMIN_PASSWORD:-SmartisDemo123!}"
      INITIAL_ADMIN_EMAIL: "${INITIAL_ADMIN_EMAIL:-}"
      INITIAL_ADMIN_PASSWORD: "${INITIAL_ADMIN_PASSWORD:-}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-120}"
      MAX_VIDEO_UPLOAD_SIZE: "${MAX_VIDEO_UPLOAD_SIZE:-524288000}"
      MAX_COVER_UPLOAD_SIZE: "${MAX_COVER_UPLOAD_SIZE:-10485760}"
      MAX_HR_DOCUMENT_UPLOAD_SIZE: "${MAX_HR_DOCUMENT_UPLOAD_SIZE:-20971520}"
      MAX_SCORM_UPLOAD_SIZE: "${MAX_SCORM_UPLOAD_SIZE:-1073741824}"
      MAX_SCORM_UNPACKED_SIZE: "${MAX_SCORM_UNPACKED_SIZE:-2147483648}"
      MAX_SCORM_FILES: "${MAX_SCORM_FILES:-10000}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://localhost}"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      EMAIL_HOST: "${EMAIL_HOST:-smtp.yandex.ru}"
      EMAIL_PORT: "${EMAIL_PORT:-465}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-true}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-false}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-HCM / LMS Smartis <noreply@localhost>}"
      LOGIN_THROTTLE_RATE: "${LOGIN_THROTTLE_RATE:-10/minute}"
      PASSWORD_RESET_THROTTLE_RATE: "${PASSWORD_RESET_THROTTLE_RATE:-5/hour}"
      INVITATION_THROTTLE_RATE: "${INVITATION_THROTTLE_RATE:-30/hour}"
      CORPORATE_EMAIL_DOMAINS: "${CORPORATE_EMAIL_DOMAINS:-}"
    depends_on:
      db: { condition: service_healthy }
    volumes: ["media_data:/app/media"]
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host': 'api', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request)"
      interval: 10s
      timeout: 5s
      retries: 8
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-smartis_lms}"
      POSTGRES_USER: "${POSTGRES_USER:-smartis}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-smartis_local_password}"
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartis} -d ${POSTGRES_DB:-smartis_lms}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backup:
    image: postgres:17-alpine
    profiles: ["maintenance"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-smartis_lms}"
      POSTGRES_USER: "${POSTGRES_USER:-smartis}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-smartis_local_password}"
      POSTGRES_HOST: db
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups"
      - media_data:/source/media:ro
      - ./infra/backup:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    depends_on:
      db: { condition: service_healthy }
  restore:
    image: postgres:17-alpine
    profiles: ["maintenance"]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-smartis_lms}"
      POSTGRES_USER: "${POSTGRES_USER:-smartis}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-smartis_local_password}"
      POSTGRES_HOST: db
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups:ro"
      - media_data:/restore/media
      - ./infra/backup:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/restore.sh"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  postgres_data:
  caddy_data:
  media_data:
