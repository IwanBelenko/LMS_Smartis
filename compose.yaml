name: smartis-lms
services:
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
  web:
    build: ./frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-unsafe-development-key}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-true}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}"
      POSTGRES_DB: "${POSTGRES_DB:-smartis_lms}"
      POSTGRES_USER: "${POSTGRES_USER:-smartis}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-smartis_local_password}"
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      DEMO_ADMIN_EMAIL: "${DEMO_ADMIN_EMAIL:-admin@smartis.local}"
      DEMO_ADMIN_PASSWORD: "${DEMO_ADMIN_PASSWORD:-SmartisDemo123!}"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/')"]
      interval: 10s
      timeout: 5s
      retries: 8
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-smartis_lms}"
      POSTGRES_USER: "${POSTGRES_USER:-smartis}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-smartis_local_password}"
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartis} -d ${POSTGRES_DB:-smartis_lms}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-smartis}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-smartis_local_storage}"
    ports: ["${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
