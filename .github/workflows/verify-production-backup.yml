name: Verify production backup restore

on:
  workflow_dispatch:
    inputs:
      backup_id:
        description: "Backup timestamp or latest"
        required: true
        default: latest
        type: string
      confirmation:
        description: "Type VERIFY_BACKUP"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smartis-production
  cancel-in-progress: false

jobs:
  verify:
    name: Restore into isolated volumes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    env:
      BACKUP_ID: ${{ inputs.backup_id }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "VERIFY_BACKUP"
          case "$BACKUP_ID" in
            latest|20[0-9][0-9][0-1][0-9][0-3][0-9]T[0-2][0-9][0-5][0-9][0-5][0-9]Z) ;;
            *) echo "Backup id must be latest or a UTC timestamp" >&2; exit 1 ;;
          esac

      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate verification script
        run: bash -n infra/verify-production-backup.sh

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          install -m 0600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload verification script
        run: |
          scp -P "$SERVER_PORT" infra/verify-production-backup.sh \
            "$SERVER_USER@$SERVER_HOST:/tmp/smartis-verify-backup-$GITHUB_RUN_ID.sh"

      - name: Verify isolated restore
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "BACKUP_ID='$BACKUP_ID' RUN_ID='$GITHUB_RUN_ID' \
             bash '/tmp/smartis-verify-backup-$GITHUB_RUN_ID.sh'; \
             status=\$?; rm -f '/tmp/smartis-verify-backup-$GITHUB_RUN_ID.sh'; exit \$status"
