name: Deploy temporary Smartis LMS

on:
  workflow_dispatch:
  push:
    branches:
      - codex/publish-smartis-lms
    paths:
      - .github/workflows/deploy-temporary.yml

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy temporary HTTPS environment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the selected revision
        uses: actions/checkout@v4

      - name: Build release archive and environment candidate
        env:
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        run: |
          test -n "$INITIAL_ADMIN_PASSWORD"
          umask 077

          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=backend/.venv \
            --exclude=frontend/node_modules \
            --exclude=frontend/dist \
            --exclude=backups \
            -czf /tmp/smartis-release.tar.gz .

          DJANGO_SECRET_KEY="$(openssl rand -hex 32)"
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"

          {
            echo 'HTTP_PORT=80'
            echo 'HTTPS_PORT=443'
            echo 'APP_SITE_ADDRESS=https://lms.89.108.88.157.sslip.io'
            echo 'SCORM_SITE_ADDRESS=https://scorm.89.108.88.157.sslip.io'
            echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY"
            echo 'DJANGO_DEBUG=false'
            echo 'DJANGO_ALLOWED_HOSTS=lms.89.108.88.157.sslip.io,scorm.89.108.88.157.sslip.io,api'
            echo 'DJANGO_CSRF_TRUSTED_ORIGINS=https://lms.89.108.88.157.sslip.io'
            echo 'CORS_ALLOWED_ORIGINS=https://lms.89.108.88.157.sslip.io'
            echo 'DJANGO_SECURE_COOKIES=true'
            echo 'DJANGO_SECURE_SSL_REDIRECT=true'
            echo 'DJANGO_SECURE_HSTS_SECONDS=0'
            echo 'DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=false'
            echo 'DJANGO_SECURE_HSTS_PRELOAD=false'
            echo 'SCORM_CONTENT_ORIGIN=https://scorm.89.108.88.157.sslip.io'
            echo 'APP_PUBLIC_URL=https://lms.89.108.88.157.sslip.io'
            echo 'EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend'
            echo 'POSTGRES_DB=smartis_lms'
            echo 'POSTGRES_USER=smartis'
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo 'BOOTSTRAP_DEMO=false'
            echo 'INITIAL_ADMIN_EMAIL=admin@smartis.local'
            echo "INITIAL_ADMIN_PASSWORD=$INITIAL_ADMIN_PASSWORD"
            echo 'GUNICORN_WORKERS=3'
            echo 'GUNICORN_TIMEOUT=120'
            echo 'MAX_VIDEO_UPLOAD_SIZE=1'
            echo 'MAX_COVER_UPLOAD_SIZE=10485760'
            echo 'MAX_QUESTION_IMAGE_UPLOAD_SIZE=10485760'
            echo 'MAX_HR_DOCUMENT_UPLOAD_SIZE=20971520'
            echo 'MAX_SCORM_UPLOAD_SIZE=1073741824'
            echo 'MAX_SCORM_UNPACKED_SIZE=2147483648'
            echo 'MAX_SCORM_FILES=10000'
            echo 'BACKUP_DIR=/opt/smartis-backups'
            echo 'BACKUP_RETENTION_DAYS=7'
          } > /tmp/smartis.env

      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Upload release files
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          test -n "$SSHPASS"
          sshpass -e scp \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            /tmp/smartis-release.tar.gz \
            /tmp/smartis.env \
            root@89.108.88.157:/tmp/

      - name: Build and start Smartis LMS
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            root@89.108.88.157 '
              set -eu
              install -d -m 0750 /opt/smartis /opt/smartis-backups
              tar -xzf /tmp/smartis-release.tar.gz -C /opt/smartis

              if [ ! -f /opt/smartis/.env ]; then
                install -m 0600 /tmp/smartis.env /opt/smartis/.env
              fi

              rm -f /tmp/smartis-release.tar.gz /tmp/smartis.env
              cd /opt/smartis
              docker compose config --quiet
              if ! docker compose pull db proxy; then
                echo "::error title=Smartis deployment::Не удалось скачать базовые образы"
                exit 1
              fi
              if ! docker compose build api; then
                echo "::error title=Smartis deployment::Не удалось собрать API"
                exit 1
              fi
              if ! docker compose build web; then
                echo "::error title=Smartis deployment::Не удалось собрать веб-интерфейс"
                exit 1
              fi
              if ! docker compose up --detach --no-build db; then
                echo "::error title=Smartis deployment::Не удалось запустить базу данных"
                docker compose ps --all || true
                exit 1
              fi
              if ! docker compose --profile maintenance run --rm backup; then
                echo "::error title=Smartis deployment::Не удалось создать резервную копию перед обновлением"
                exit 1
              fi
              if ! docker compose up --detach --no-build api; then
                echo "::error title=Smartis deployment::Не удалось запустить API"
                docker compose logs --no-color --tail 40 api db | while IFS= read -r line; do
                  echo "::error title=Журнал контейнера::$line"
                done
                exit 1
              fi

              attempt=0
              until docker compose exec -T api python -c "import urllib.request; urllib.request.urlopen('\''http://127.0.0.1:8000/api/v1/health/'\'')"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 24 ]; then
                  echo "::error title=Smartis deployment::API не прошёл проверку готовности"
                  docker compose ps
                  docker compose logs --no-color --tail 40 api db | while IFS= read -r line; do
                    echo "::error title=Журнал контейнера::$line"
                  done
                  exit 1
                fi
                sleep 5
              done

              if ! docker compose up --detach --no-build web proxy; then
                echo "::error title=Smartis deployment::Не удалось запустить веб-интерфейс или HTTPS-прокси"
                docker compose logs --no-color --tail 40 web proxy | while IFS= read -r line; do
                  echo "::error title=Журнал контейнера::$line"
                done
                exit 1
              fi

              sed -i "s/^INITIAL_ADMIN_EMAIL=.*/INITIAL_ADMIN_EMAIL=/" .env
              sed -i "s/^INITIAL_ADMIN_PASSWORD=.*/INITIAL_ADMIN_PASSWORD=/" .env
              printf "%s\n" "${{ github.sha }}" > .deployed-revision

              docker compose ps
              df -h /
            '
