name: Smartis server diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - codex/publish-smartis-lms
    paths:
      - .github/workflows/server-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect staged Smartis containers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install SSH password helper
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass

      - name: Read container status and recent logs
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          test -n "$SSHPASS"
          sshpass -e ssh \
            -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new \
            -o PreferredAuthentications=password \
            -o PubkeyAuthentication=no \
            root@89.108.88.157 '
              set -u
              cd /opt/smartis
              docker compose ps --all || true
              docker compose images || true
              docker compose logs --tail 160 api web proxy db || true
              df -h /
              free -h
            '
