name: Deploy Smartis LMS to production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Immutable release tag, for example v0.3.0"
        required: true
        type: string
      confirmation:
        description: "Type DEPLOY_PRODUCTION"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: smartis-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.release.outputs.revision }}

    steps:
      - name: Require explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "DEPLOY_PRODUCTION"

      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify immutable tag from main
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Release tag must look like v0.3.0" >&2; exit 1 ;;
          esac
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}

  deploy:
    name: Backup and deploy
    needs:
      - validate
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://lms.89.108.88.157.sslip.io/
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      REVISION: ${{ needs.validate.outputs.revision }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_PORT: ${{ secrets.SERVER_PORT }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

    steps:
      - name: Check out verified release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Build release archive
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=backend/.venv \
            --exclude=frontend/node_modules \
            --exclude=frontend/dist \
            --exclude=backups \
            -czf /tmp/smartis-release.tar.gz .

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_PORT"
          test -n "$SERVER_USER"
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_KNOWN_HOSTS"
          install -d -m 0700 ~/.ssh
          install -m 0600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload immutable release
        run: |
          scp -P "$SERVER_PORT" /tmp/smartis-release.tar.gz \
            "$SERVER_USER@$SERVER_HOST:/tmp/smartis-$REVISION.tar.gz"

      - name: Backup and activate release
        run: |
          ssh -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "REVISION='$REVISION' RELEASE_TAG='$RELEASE_TAG' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          app_root=/opt/smartis
          releases_root=/opt/smartis-releases
          release_dir="$releases_root/$REVISION"
          release_tmp="$release_dir.tmp.$$"
          current_link=/opt/smartis-current
          archive="/tmp/smartis-$REVISION.tar.gz"
          previous_target=""

          test -f "$app_root/.env"
          test -f "$archive"
          test "$(df --output=pcent / | tail -1 | tr -dc '0-9')" -lt 90

          if [ -L "$current_link" ]; then
            previous_target="$(readlink -f "$current_link")"
          elif [ -f "$app_root/compose.yaml" ]; then
            previous_target="$app_root"
          fi

          install -d -m 0750 "$releases_root"
          if [ -d "$release_dir" ]; then
            test "$(cat "$release_dir/.release-revision")" = "$REVISION"
          else
            install -d -m 0750 "$release_tmp"
            tar -xzf "$archive" -C "$release_tmp"
            printf '%s\n' "$REVISION" > "$release_tmp/.release-revision"
            mv "$release_tmp" "$release_dir"
          fi
          rm -f "$archive"

          compose() {
            docker compose --project-name smartis-lms --env-file "$app_root/.env" \
              --file "$release_dir/compose.yaml" "$@"
          }

          compose config --quiet
          compose pull db proxy
          compose build api
          compose build web
          compose up --detach --no-build db

          backup_output="$(compose --profile maintenance run --rm backup)"
          printf '%s\n' "$backup_output"
          backup_path="$(printf '%s\n' "$backup_output" | sed -n 's/^Backup created: //p' | tail -1)"
          backup_id="$(basename "$backup_path")"
          test -n "$backup_id"
          test -s "/opt/smartis-backups/$backup_id/database.dump"
          test -s "/opt/smartis-backups/$backup_id/media.tar.gz"

          ln -sfn "$release_dir" "$current_link"

          rollback_code() {
            status=$?
            if [ "$status" -ne 0 ] && [ -n "$previous_target" ]; then
              echo "Deployment failed; rebuilding the previous application release." >&2
              ln -sfn "$previous_target" "$current_link"
              docker compose --project-name smartis-lms --env-file "$app_root/.env" \
                --file "$previous_target/compose.yaml" build api web || true
              docker compose --project-name smartis-lms --env-file "$app_root/.env" \
                --file "$previous_target/compose.yaml" up --detach --no-build api web proxy || true
            fi
            exit "$status"
          }
          trap rollback_code EXIT

          compose up --detach --no-build api web proxy
          attempt=0
          until compose exec -T api python -c "import urllib.request; r = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/', headers={'Host':'api','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=5)"; do
            attempt=$((attempt + 1))
            if [ "$attempt" -ge 24 ]; then
              compose ps --all
              compose logs --no-color --tail 80 api db
              exit 1
            fi
            sleep 5
          done

          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            https://lms.89.108.88.157.sslip.io/api/v1/health/ >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            https://lms.89.108.88.157.sslip.io/ >/dev/null

          printf '%s %s\n' "$REVISION" "$RELEASE_TAG" > "$releases_root/.deployed-revision"
          compose ps
          df -h /
          trap - EXIT
          REMOTE

      - name: Report deployed version
        run: echo "Deployed $RELEASE_TAG ($REVISION)"
